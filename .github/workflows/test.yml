name: Tests
on:
  # Our own branches live on the wl-net fork, so a cross-fork pull request
  # gets its push run over there and never reports a check here, which makes
  # an upstream PR look untested. pull_request covers that.
  #
  # Dependabot's branches live on this repo, so they are the only ones that
  # would get both a push run and a pull_request run for the same commit;
  # branches-ignore drops the duplicate. ('branches' and 'branches-ignore'
  # cannot both be used for one event, so this replaces the '**' allowlist.)
  push:
    tags-ignore:
      - '**'
    branches-ignore:
      - 'dependabot/**'
  pull_request:

# A pull_request run from a fork executes that PR's own build scripts and
# tests. GitHub already forces the token read-only and withholds secrets for
# fork events, and this workflow reads no secrets; stating it here keeps that
# true for the same-repo runs too, where the repository default would apply.
permissions:
  contents: read

jobs:
  Test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: ['11', '21']
    name: Test (JDK ${{ matrix.java-version }})
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v6
        with:
           java-version: ${{ matrix.java-version }}
           distribution: 'corretto'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Keep the MIT-licensed caching provider: gradle/actions v6 moved the
          # default 'enhanced' provider into the closed-source
          # gradle-actions-caching component, covered by Gradle's commercial
          # Terms of Use rather than the MIT License. 'basic' is a thin
          # wrapper over actions/cache and stays open source.
          cache-provider: basic
          # Load-bearing for untrusted code, not just a cache-hit-rate knob:
          # github.ref is 'refs/pull/N/merge' on a pull_request, so this keeps
          # a fork's PR from writing a cache that a later master run reads.
          # Only master may populate it.
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}
      - name: Run tests
        run: ./gradlew test --no-daemon

  Check-Driver-Changes:
    runs-on: ubuntu-latest
    name: Check for driver file changes
    outputs:
      drivers-changed: ${{ steps.check.outputs.drivers-changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check for driver file changes
        id: check
        run: |
          BASE=$(git merge-base origin/master ${{ github.sha }} 2>/dev/null || echo "${{ github.event.before || 'HEAD~1' }}")
          if git diff --name-only "$BASE" ${{ github.sha }} | grep -qE '\.(driver|feature)$'; then
            echo "drivers-changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "drivers-changed=false" >> "$GITHUB_OUTPUT"
          fi

  Driver-Cucumber-Tests:
    runs-on: ubuntu-latest
    name: Driver Cucumber Tests
    needs: Check-Driver-Changes
    if: needs.Check-Driver-Changes.outputs.drivers-changed == 'true'
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'corretto'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # See the note on the Test job: 'basic' keeps the MIT-licensed cache.
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}
      - name: Run driver cucumber tests
        run: ./gradlew :platform:arcus-platform-drivers:driver-tests:cucumber --no-daemon

  Driver-SetAttributes-Smoke-Test:
    runs-on: ubuntu-latest
    name: Driver SetAttributes Smoke Test
    needs: Check-Driver-Changes
    if: needs.Check-Driver-Changes.outputs.drivers-changed == 'true'
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'corretto'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # See the note on the Test job: 'basic' keeps the MIT-licensed cache.
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}
      - name: Run driver setAttributes smoke test
        run: ./gradlew :platform:arcus-platform-drivers:driver-tests:test -PincludeDriverSmokeTest --no-daemon
